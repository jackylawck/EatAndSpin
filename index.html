<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食一轉 · Eat & Spin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <header class="header">
      <h1 data-i18n="appTitle">食一轉 · Eat & Spin</h1>
      <div class="lang-switch">
        <button id="btnLangZh">繁中</button>
        <button id="btnLangEn">EN</button>
      </div>
    </header>

    <!-- 隱私安全承諾聲明 -->
    <div class="privacy-bar">
      🔒 <strong>隱私聲明：</strong> GPS 定位純於本地運行，絕不安裝或傳送個人位置至外置伺服器。
    </div>

    <!-- 定位與環境列 -->
    <div id="statusNotice" class="notice-bar">
      <span id="locationText">📍 點擊按鈕獲取周邊 12 間餐廳</span><br>
      <button id="btnGeo" class="geo-btn" style="margin-top:6px;">📡 搜尋周邊 12 間餐廳 (GPS)</button>
    </div>

    <!-- 輪盤區域 -->
    <div class="wheel-container">
      <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>

    <button id="spinBtn" class="spin-btn" data-i18n="spinBtn">食一轉！</button>

    <!-- 投票與手動新增區域 -->
    <div class="vote-section">
      <h3>🗳️ 餐廳選單與加權投票 (預設各 1 票)</h3>
      <div class="input-group">
        <input type="text" id="customInput" placeholder="自己加餐廳 (例: 壽司郎/壽喜燒)">
        <button id="btnAddItem">新增選項</button>
      </div>
      <ul id="itemList" class="item-list"></ul>
    </div>

    <div id="resultBox" class="result-box"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
