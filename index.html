  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="Eatandspinicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="Eatandspinicon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="Eatandspinicon-512.png">

  <!-- iOS Web App 設定 -->
  <meta name="theme-color" content="#ff4757">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preload" href="./css/style.css" as="style">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- 主應用容器 -->
  <main class="container" role="application" aria-label="食一轉搵食輪盤應用程式">

    <!-- 頁首標頭 -->
    <header class="header">
      <h1 data-i18n="appTitle">食一轉 · Eat & Spin</h1>
      <div class="lang-switch" role="group" aria-label="語言切換">
        <button id="btnLangZh" class="active" aria-pressed="true" aria-label="切換至繁體中文">繁中</button>
        <button id="btnLangEn" aria-pressed="false" aria-label="Switch to English">EN</button>
      </div>
    </header>

    <!-- 模式切換 Tabs -->
    <nav class="mode-tabs" role="tablist" aria-label="功能模式">
      <button id="tabRestaurant" class="tab-btn active" role="tab" aria-selected="true" aria-controls="restaurant-mode" data-i18n="tabRestaurant">🏪 搵餐廳 Mode</button>
      <button id="tabSetMenu" class="tab-btn" role="tab" aria-selected="false" aria-controls="setmenu-mode" data-i18n="tabSetMenu">🍱 揀 ABCD 餐 Mode</button>
    </nav>

    <!-- 隱私安全聲明 -->
    <aside class="privacy-bar" role="note" aria-label="隱私聲明">
      🔒 <strong>隱私聲明：</strong> 本地運算，絕不上傳或儲存個人位置。
    </aside>

    <!-- 餐廳模式專用：地點搜尋與篩選 -->
    <section id="locationSearchBox" class="notice-bar" role="region" aria-label="地點搜尋與篩選區塊">
      <div class="input-group" style="margin-bottom:8px;">
        <label for="locationInput" class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">輸入地點</label>
        <input type="search" id="locationInput" placeholder="輸入地點 (例: 觀塘 / 中環 / 灣仔)" autocomplete="off" spellcheck="false" aria-label="搜尋餐廳地點">
        <button id="btnSearchLoc" class="action-btn" aria-label="搜尋地點餐廳" data-i18n="btnSearchLoc">搜尋地點</button>
      </div>

      <!-- 篩選類別 -->
      <div class="filter-section" style="margin: 8px 0; text-align: left;">
        <span style="font-size: 0.85rem; color: #a0aec0; display: block; margin-bottom: 6px;" data-i18n="filterTitle">🎯 預先篩選類別：</span>
        <div class="chip-group" style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.85rem;">
          <label class="chip" style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 12px; cursor: pointer;">
            <input type="checkbox" id="filterNoCafe" checked aria-label="剔除 Cafe/咖啡店"> 🚫 剔除 Cafe/咖啡店
          </label>
          <label class="chip" style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 12px; cursor: pointer;">
            <input type="checkbox" class="cuisine-filter" value="chinese" aria-label="篩選中菜/點心"> 🥢 中菜/點心
          </label>
          <label class="chip" style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 12px; cursor: pointer;">
            <input type="checkbox" class="cuisine-filter" value="japanese" aria-label="篩選日韓料理"> 🍣 日韓料理
          </label>
          <label class="chip" style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 12px; cursor: pointer;">
            <input type="checkbox" class="cuisine-filter" value="asian" aria-label="篩選東南亞/粉麵"> 🍜 東南亞/粉麵
          </label>
          <label class="chip" style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 12px; cursor: pointer;">
            <input type="checkbox" class="cuisine-filter" value="western" aria-label="篩選西式/披薩"> 🍕 西式/披薩
          </label>
        </div>
      </div>

      <button id="btnGeo" class="geo-btn" style="margin-top: 6px;" aria-label="使用目前 GPS 位置搜尋周邊餐廳" data-i18n="btnGeo">📡 使用目前 GPS 位置 (12間)</button>
    </section>

    <!-- 輪盤區域 -->
    <figure class="wheel-container" aria-label="餐廳決策輪盤">
      <canvas id="wheelCanvas" width="300" height="300" role="img" aria-label="餐廳決策輪盤，顯示各選項的扇形分佈"></canvas>
    </figure>

    <button id="spinBtn" class="spin-btn" data-i18n="spinBtn" aria-label="開始旋轉輪盤，隨機選出餐廳">食一轉！</button>

    <!-- 中獎結果顯示區 -->
    <div id="resultBox" class="result-box" style="margin-top: 12px; margin-bottom: 12px; display: none;" role="status" aria-live="polite"></div>

    <!-- 投票與自訂項目區域 -->
    <section class="vote-section" aria-label="餐廳選單與加權投票">
      <h3 id="sectionTitle" data-i18n="sectionTitle">🗳️ 餐廳選單與加權投票 (預設各 1 票)</h3>

      <button id="btnReplenish" class="action-btn" style="width:100%; margin-bottom:10px; display:none; background-color: #2ed573;" aria-label="補抓附近其他餐廳，補滿 12 間" data-i18n="btnReplenish">
        🔄 補抓附近其他餐廳 (補滿 12 間)
      </button>

      <div class="input-group">
        <label for="customInput" class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">自訂選項</label>
        <input type="text" id="customInput" placeholder="自己加選項 (例: F餐/特餐)" spellcheck="false" aria-label="輸入自訂選項名稱">
        <button id="btnAddItem" class="action-btn" aria-label="新增自訂選項" data-i18n="btnAddItem">新增選項</button>
      </div>

      <ul id="itemList" class="item-list" role="list" aria-label="當前選項清單"></ul>
    </section>

    <!-- 頁尾法律與隱私連結 -->
    <footer style="margin-top: 24px; padding: 12px 0; font-size: 0.8rem; color: #718096; text-align: center; border-top: 1px solid rgba(255,255,255,0.1);">
      <a href="PRIVACY.md" target="_blank" rel="noopener noreferrer" style="color: #a0aec0; text-decoration: none; margin: 0 8px;">隱私政策 (Privacy)</a> |
      <a href="TERMS.md" target="_blank" rel="noopener noreferrer" style="color: #a0aec0; text-decoration: none; margin: 0 8px;">服務條款 (Terms)</a>
    </footer>

  </main>

  <!-- 模組化 JavaScript 入口 -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
