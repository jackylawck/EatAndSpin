<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食一轉 · Eat & Spin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <header class="header">
      <h1 data-i18n="appTitle">食一轉 · Eat & Spin</h1>
      <div class="lang-switch">
        <button id="btnLangZh">繁中</button>
        <button id="btnLangEn">EN</button>
      </div>
    </header>

    <div id="statusNotice" class="notice-bar">
      <span data-i18n="loadingStatus">正在感應環境數據...</span>
    </div>

    <div class="wheel-container">
      <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>

    <button id="spinBtn" class="spin-btn" data-i18n="spinBtn">食一轉！</button>

    <div id="resultBox" class="result-box"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
