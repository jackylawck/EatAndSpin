<body>

  <div class="container">
    <header class="header">
      <h1 data-i18n="appTitle">食一轉 · Eat & Spin</h1>
      <div class="lang-switch">
        <button id="btnLangZh" class="active">繁中</button>
        <button id="btnLangEn">EN</button>
      </div>
    </header>

    <!-- 模式切換 Tabs -->
    <div class="mode-tabs">
      <button id="tabRestaurant" class="tab-btn active">🏪 搵餐廳 Mode</button>
      <button id="tabSetMenu" class="tab-btn">🍱 揀 ABCD 餐 Mode</button>
    </div>

    <!-- 隱私安全聲明 -->
    <div class="privacy-bar">
      🔒 <strong>隱私聲明：</strong> 本地運算，絕不上傳或儲存個人位置。
    </div>

    <!-- 餐廳模式專用：地點搜尋列與預先篩選 -->
    <div id="locationSearchBox" class="notice-bar">
      <div class="input-group" style="margin-bottom:8px;">
        <input type="text" id="locationInput" placeholder="輸入地點 (例: 觀塘 / 中環 / 灣仔)">
        <button id="btnSearchLoc" class="action-btn">搜尋地點</button>
      </div>

      <!-- 事前菜式與類型篩選 Filter Chips -->
      <div class="filter-section" style="margin: 8px 0; text-align: left;">
        <span style="font-size: 0.85rem; color: #a0aec0; display: block; margin-bottom: 6px;">🎯 預先篩選類別：</span>
        <div class="chip-group" style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.85rem;">
          <label class="chip" style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 12px; cursor: pointer;">
            <input type="checkbox" id="filterNoCafe" checked> 🚫 剔除 Cafe/咖啡店
          </label>
          <label class="chip" style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 12px; cursor: pointer;">
            <input type="checkbox" class="cuisine-filter" value="chinese"> 🥢 中菜/點心
          </label>
          <label class="chip" style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 12px; cursor: pointer;">
            <input type="checkbox" class="cuisine-filter" value="japanese"> 🍣 日韓料理
          </label>
          <label class="chip" style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 12px; cursor: pointer;">
            <input type="checkbox" class="cuisine-filter" value="asian"> 🍜 東南亞/粉麵
          </label>
          <label class="chip" style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 12px; cursor: pointer;">
            <input type="checkbox" class="cuisine-filter" value="western"> 🍕 西式/披薩
          </label>
        </div>
      </div>

      <button id="btnGeo" class="geo-btn" style="margin-top: 6px;">📡 使用目前 GPS 位置 (12間)</button>
    </div>

    <!-- 輪盤區域 -->
    <div class="wheel-container">
      <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>

    <button id="spinBtn" class="spin-btn" data-i18n="spinBtn">食一轉！</button>

    <!-- 中獎結果顯示區 -->
    <div id="resultBox" class="result-box" style="margin-top: 12px; margin-bottom: 12px;"></div>

    <!-- 投票與手動新增區域 -->
    <div class="vote-section">
      <h3 id="sectionTitle">🗳️ 餐廳選單與加權投票 (預設各 1 票)</h3>

      <!-- 補抓備用餐廳按鈕 -->
      <button id="btnReplenish" class="action-btn" style="width:100%; margin-bottom:10px; display:none; background-color: #2ed573;">
        🔄 補抓附近其他餐廳 (補滿 12 間)
      </button>

      <div class="input-group">
        <input type="text" id="customInput" placeholder="自己加選項 (例: F餐/特餐)">
        <button id="btnAddItem" class="action-btn">新增選項</button>
      </div>
      <ul id="itemList" class="item-list"></ul>
    </div>

    <!-- 頁尾法律與隱私連結 -->
    <footer style="margin-top: 24px; padding: 12px 0; font-size: 0.8rem; color: #718096; text-align: center; border-top: 1px solid rgba(255,255,255,0.1);">
      <a href="PRIVACY.md" target="_blank" style="color: #a0aec0; text-decoration: none; margin: 0 8px;">隱私政策 (Privacy)</a> |
      <a href="TERMS.md" target="_blank" style="color: #a0aec0; text-decoration: none; margin: 0 8px;">服務條款 (Terms)</a>
    </footer>

  </div>

</body>
