<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Google Search Console 驗證標籤 -->
  <meta name="google-site-verification" content="JZ5UohX-CcP_fQV0_DI9VadkKY4ZoTTkUifL88-fIcY" />

  <title>食一轉 · Eat & Spin</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS / Safari 專用 Icon (解決分享選單與加至主畫面顯示問題) -->
  <link rel="apple-touch-icon" sizes="180x180" href="./EatandSpinicon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./EatandSpinicon-512.png">

  <!-- Open Graph 標籤 (解決 iOS/WhatsApp/FB 分享時的連結縮圖) -->
  <meta property="og:title" content="食一轉 · Eat & Spin">
  <meta property="og:description" content="香港專屬、結合動態加權投票與地點檢索的餐飲決策 Web App">
  <meta property="og:image" content="./EatandSpinicon-512.png">

  <!-- iOS Web App 主題設定 -->
  <meta name="theme-color" content="#ff4757">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="食一轉">

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="container">
    <header class="header">
      <h1 data-i18n="appTitle">食一轉 · Eat & Spin</h1>
      <div class="lang-switch">
        <button id="btnLangZh">繁中</button>
        <button id="btnLangEn">EN</button>
      </div>
    </header>

    <!-- 模式切換 Tabs -->
    <div class="mode-tabs">
      <button id="tabRestaurant" class="tab-btn active">🏪 搵餐廳 Mode</button>
      <button id="tabSetMenu" class="tab-btn">🍱 揀 ABCD 餐 Mode</button>
    </div>

    <!-- 隱私安全聲明 -->
    <div class="privacy-bar">
      🔒 <strong>隱私聲明：</strong> 本地運算，絕不上傳或儲存個人位置。
    </div>

    <!-- 餐廳模式專用：地點搜尋列 -->
    <div id="locationSearchBox" class="notice-bar">
      <div class="input-group" style="margin-bottom:6px;">
        <input type="text" id="locationInput" placeholder="輸入地點 (例: 觀塘 / 中環 / 灣仔)">
        <button id="btnSearchLoc" class="action-btn">搜尋地點</button>
      </div>
      <button id="btnGeo" class="geo-btn">📡 使用目前 GPS 位置 (12間)</button>
    </div>

    <!-- 輪盤區域 -->
    <div class="wheel-container">
      <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>

    <button id="spinBtn" class="spin-btn" data-i18n="spinBtn">食一轉！</button>

    <!-- 投票與手動新增區域 -->
    <div class="vote-section">
      <h3 id="sectionTitle">🗳️ 餐廳選單與加權投票 (預設各 1 票)</h3>
      <div class="input-group">
        <input type="text" id="customInput" placeholder="自己加選項 (例: F餐/特餐)">
        <button id="btnAddItem" class="action-btn">新增選項</button>
      </div>
      <ul id="itemList" class="item-list"></ul>
    </div>

    <div id="resultBox" class="result-box"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
